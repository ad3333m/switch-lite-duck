name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    name: Switch nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Address bar check
        run: gcc -Isource tests/test_url.c -o /tmp/t && /tmp/t
      - name: Build
        run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: LightBrowser
          path: LightBrowser.nro
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! command -v gh >/dev/null; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz | tar xz -C /tmp
            export PATH="/tmp/gh_2.100.0_linux_amd64/bin:$PATH"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "Light Browser" --notes "Latest build."
          gh release upload latest LightBrowser.nro --clobber --repo "$GITHUB_REPOSITORY"
